<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abonelik İptali</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .box {
      width: 92%;
      max-width: 520px;
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .text {
      font-size: 14px;
      line-height: 1.5;
      color: #555;
    }

    .small {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Würth</div>
    <div id="status" class="status">Abonelik iptal talebiniz işleniyor...</div>
    <div id="text" class="text">Lütfen birkaç saniye bekleyiniz.</div>
    <div id="debug" class="small"></div>
  </div>

  <script>
    /*
      ÖNEMLİ:
      Buraya Mysoft kullanıcı adı / şifre koymuyoruz.
      Bu sayfa sadece URL parametrelerini okuyup güvenli Worker endpoint'ine iletecek.
    */

    const WORKER_ENDPOINT = "BURAYA_CLOUDFLARE_WORKER_URL_GELECEK";

    const params = new URLSearchParams(window.location.search);

    const email = params.get("iys_email");
    const action = params.get("iys_action");
    const source = params.get("iys_source") || "inxmail";
    const redirect = params.get("redirect");

    const statusEl = document.getElementById("status");
    const textEl = document.getElementById("text");
    const debugEl = document.getElementById("debug");

    function finishMessage(title, message) {
      statusEl.textContent = title;
      textEl.textContent = message;
    }

    function redirectToOriginalLink() {
      if (redirect) {
        window.location.href = redirect;
      }
    }

    async function run() {
      if (!email) {
        finishMessage("E-posta bilgisi alınamadı.", "Abonelik iptal işlemi tamamlanamadı.");
        return;
      }

      if (action !== "RET") {
        finishMessage("Geçersiz işlem.", "Abonelik iptal işlemi için geçerli bir işlem bilgisi bulunamadı.");
        return;
      }

      if (!WORKER_ENDPOINT || WORKER_ENDPOINT === "BURAYA_CLOUDFLARE_WORKER_URL_GELECEK") {
        finishMessage("Ara endpoint tanımlanmadı.", "Cloudflare Worker URL bilgisi eklendikten sonra işlem çalışacaktır.");
        debugEl.textContent = "E-posta: " + email + " | Aksiyon: " + action + " | Kaynak: " + source;
        return;
      }

      try {
        const workerUrl = new URL(WORKER_ENDPOINT);
        workerUrl.searchParams.set("iys_email", email);
        workerUrl.searchParams.set("iys_action", action);
        workerUrl.searchParams.set("iys_source", source);

        const response = await fetch(workerUrl.toString(), {
          method: "GET"
        });

        const resultText = await response.text();

        if (!response.ok) {
          finishMessage("İşlem sırasında hata oluştu.", "Lütfen daha sonra tekrar deneyiniz.");
          debugEl.textContent = resultText;
          return;
        }

        finishMessage("Abonelik iptal talebiniz alınmıştır.", "E-posta izin tercihiniz güncelleniyor.");

        setTimeout(function () {
          redirectToOriginalLink();
        }, 1500);

      } catch (error) {
        finishMessage("İşlem sırasında hata oluştu.", "Lütfen daha sonra tekrar deneyiniz.");
        debugEl.textContent = error.message;
      }
    }

    run();
  </script>
</body>
</html>
